<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xem trước công trình</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;height:100%;background:#12070e;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head><body><canvas id="c"></canvas>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { loadGLTF } from './gltf-load.js';
import { buildHouseKay, buildCasinoKay, casinoLights, buildCathedral } from './kaybuild.js';
import { createCharacter } from './character.js';

const q = new URLSearchParams(location.search);
const night = q.get('night') === '1';
const view = q.get('view') || 'casino';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight, false);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = night ? 1.2 : 1.05;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(night ? '#1a0d2a' : '#9fd0f0');
scene.fog = new THREE.Fog(scene.background, 120, 300);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);

await document.fonts.load('80px Bungee', 'SÒNG ĐÊM');
const kit = await loadGLTF('assets/citykit.json');
let kitMat; kit.scene.traverse((o) => { if (o.isMesh && !kitMat) kitMat = o.material; });
kitMat.metalness = 0; kitMat.roughness = 0.85;
const mat = kitMat.clone();
if (night) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 256, 256);
  const gr = g.createLinearGradient(0, 192, 0, 256); gr.addColorStop(0, '#ffcf86'); gr.addColorStop(1, '#7a5232');
  g.fillStyle = gr; g.fillRect(0, 192, 64, 64);
  const t = new THREE.CanvasTexture(c); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace;
  mat.emissive = new THREE.Color('#fff'); mat.emissiveMap = t; mat.emissiveIntensity = 1.7;
}

// Nền ô và đường
const kitObj = (n) => kit.scene.getObjectByName(n);
function tile(n, x, z, ry = 0, s = 6) { const o = kitObj(n).clone(); o.position.set(x, 0, z); o.rotation.y = ry; o.scale.multiplyScalar(s); o.traverse((m) => { if (m.isMesh) { m.receiveShadow = true; m.castShadow = n !== 'base' && !n.startsWith('road'); } }); scene.add(o); return o; }
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: night ? '#2a2633' : '#7d8a6a' }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
for (const cx of [-48, 0]) for (let tx = -1; tx <= 1; tx++) for (let tz = -1; tz <= 1; tz++) tile('base', cx + tx * 12, tz * 12);
for (let x = -84; x <= 36; x += 12) tile(x === -24 ? 'road_junction' : 'road_straight', x, 24, x === -24 ? 0 : Math.PI / 2);
tile('road_straight', -24, 0); tile('road_straight', -24, -12); tile('road_straight', -24, 12);
const grass = new THREE.Mesh(new THREE.BoxGeometry(34, 0.06, 34), new THREE.MeshStandardMaterial({ color: '#5f9a48', roughness: 1 }));
grass.position.set(-48, 0.63, 0); grass.receiveShadow = true; scene.add(grass);

// Công trình
const casino = buildCasinoKay(mat); casino.mesh.position.set(0, 0.6, -5); scene.add(casino.mesh);
const signTex = (() => {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 200; const g = c.getContext('2d');
  g.font = '150px Bungee'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = '#ff3d9a'; g.shadowBlur = 34; g.fillStyle = '#ffe3a1'; g.fillText('SÒNG ĐÊM', 512, 112);
  g.shadowBlur = 10; g.fillText('SÒNG ĐÊM', 512, 112);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const bladeTex = (() => {
  const c = document.createElement('canvas'); c.width = 160; c.height = 1100; const g = c.getContext('2d');
  g.font = '96px Bungee'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = '#ffcf5a'; g.shadowBlur = 20; g.fillStyle = '#fff3c9';
  'CASINO'.split('').forEach((ch, i) => g.fillText(ch, 80, 120 + i * 170));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const cl = casinoLights(casino, signTex, bladeTex);
cl.group.position.copy(casino.mesh.position); scene.add(cl.group);
if (!night) { cl.bulbMat.color.set('#d9c49a'); cl.signs.forEach((m) => { m.opacity = 0.85; }); }
const coin = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 0.55, 36), new THREE.MeshStandardMaterial({ color: '#e2b24b', metalness: 0.6, roughness: 0.35, emissive: '#6a4300', emissiveIntensity: 0.5 }));
coin.rotation.set(Math.PI / 2, 0, 0); coin.position.set(0, 0.6 + casino.top + 10.8, -6); coin.castShadow = true; scene.add(coin);

const house = buildHouseKay(mat); house.mesh.position.set(-48, 0.6, -4); scene.add(house.mesh);
const porch = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), new THREE.MeshBasicMaterial({ color: night ? '#ffe2a0' : '#cbb68e', toneMapped: false }));
porch.position.copy(house.lights[0]).add(house.mesh.position); scene.add(porch);
// Cây bụi, ghế, đèn đường của KayKit quanh nhà và casino
for (const [x, z, s] of [[-60, -14, 1.7], [-36, -15, 1.5], [-61, 9, 1.6], [-35, 10, 1.8], [-56, 14, 0.9], [-40, 14, 0.9]]) tile('bush', x, z, x, 6 * s);
tile('bench', -54, 7, Math.PI / 2); tile('streetlight', -31, 17.8, Math.PI / 2); tile('streetlight', 12, 17.8, Math.PI / 2);
tile('car_taxi', 6, 21.6, -Math.PI / 2).position.y = 0.86; tile('car_sedan', -70, 26.4, Math.PI / 2).position.y = 0.86;
tile('building_B_withoutBase', 36, -6, -Math.PI / 2); tile('base', 36, -6); tile('base', 36, 6);

// Nhà thờ lớn
for (let tx = -1; tx <= 1; tx++) for (let tz = -1; tz <= 2; tz++) tile('base', 96 + tx * 12, tz * 12 - 4);
const cath = buildCathedral(mat); cath.mesh.position.set(96, 0.6, -4); scene.add(cath.mesh);
for (const [x, z] of [[84, 10], [108, 10], [84, -16], [108, -16]]) tile('bush', x, z, x, 6 * 1.5);
tile('streetlight', 88, 22, Math.PI / 2); tile('streetlight', 104, 22, Math.PI / 2);

// Nhân vật để so tỉ lệ
for (const [name, x, z, ry] of [['Teacher', 95, 16.5, 0.3], ['Businessman', -46.5, 7.4, 0.5], ['Businesswoman', 1.5, 13.5, 0.3], ['Police', 7.5, 17, -0.6]]) {
  const c = await createCharacter(name); c.animate(0, 0, 0, 0); c.object.position.set(x, 0.6, z); c.object.rotation.y = ry;
  c.object.traverse((o) => { if (o.isMesh) o.castShadow = true; }); scene.add(c.object);
}

// Ánh sáng
const hemi = new THREE.HemisphereLight(night ? '#7b6bc8' : '#dfeeff', night ? '#2a1d33' : '#6b5d48', night ? 0.9 : 1.3); scene.add(hemi);
const sun = new THREE.DirectionalLight(night ? '#9fb0ff' : '#fff1dc', night ? 0.7 : 2.6);
sun.position.set(night ? -40 : 50, 80, night ? 30 : 60); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -70, right: 140, top: 60, bottom: -60, far: 300 }); sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.05;
scene.add(sun);
if (night) {
  for (const [x, y, z, c, i] of [[0, 5, 10, '#ffd28a', 120], [-12, 6, 12, '#ff5aa8', 60], [12, 6, 12, '#ff5aa8', 60], [-46.5, 3, 5.5, '#ffd28a', 25]]) { const l = new THREE.PointLight(c, i, 30, 1.6); l.position.set(x, y, z); scene.add(l); }
}

const views = {
  casino: [[22, 14, 46], [0, 9, 0]],
  casinoClose: [[-10, 4, 24], [0, 6, 5]],
  house: [[-30, 11, 26], [-48, 4, -2]],
  overview: [[-10, 48, 72], [-22, 4, -2]],
  cathedral: [[122, 14, 52], [96, 13, -4]],
  cathedralSide: [[140, 22, -30], [96, 12, -4]],
  cathedralFront: [[92, 4, 34], [96, 12, 6]],
};
const [p, t] = views[view] || views.casino;
cam.position.set(...p); cam.lookAt(...t);
r.render(scene, cam);
requestAnimationFrame(() => { r.render(scene, cam); window.__ready = true; });
</script></body></html>
