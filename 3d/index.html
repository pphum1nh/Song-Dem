<style>
  :root {
    --bg: #12070e;
    --panel: #1d1020;
    --panel-2: #271629;
    --border: #3d2742;
    --text: #f7efe6;
    --muted: #bba9b9;
    --accent: #ffc94d;
    --accent-ink: #2b1a00;
    --pink: #ff4fa3;
    --r: 14px;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  /* Game luôn dùng giao diện tối; khai báo lại để giữ nguyên ở cả hai chế độ */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #12070e; --panel: #1d1020; --text: #f7efe6; } }
  :root[data-theme="dark"] { --bg: #12070e; --panel: #1d1020; --text: #f7efe6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud { position: fixed; z-index: 2; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  /* Đồng hồ */
  #clock { top: calc(var(--sat) + 12px); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35); pointer-events: none; }
  #clock-icon { width: 22px; height: 22px; color: var(--accent); display: grid; place-items: center; }
  #clock-icon svg { width: 22px; height: 22px; }
  #clock-time { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .5px; min-width: 62px; }
  #clock-day { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }

  /* Nút tốc độ */
  #phone { position: fixed; z-index: 2; top: calc(var(--sat) + 12px); right: calc(var(--sar) + 12px);
    width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); display: grid; place-items: center; }
  #phone svg { width: 22px; height: 22px; }
  #cash { top: calc(var(--sat) + 66px); left: 50%; transform: translateX(-50%); pointer-events: none;
    padding: 4px 12px; border-radius: 999px; background: rgba(29,16,32,.86); border: 1px solid var(--border);
    color: var(--accent); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  #jump { position: fixed; z-index: 2; right: calc(var(--sar) + 22px); bottom: calc(var(--sab) + 28px);
    width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35);
    background: rgba(29,16,32,.72); color: var(--text); display: grid; place-items: center; touch-action: none; }
  #jump svg { width: 30px; height: 30px; }
  #jump:active { transform: scale(.94); background: var(--panel-2); }
  #toast { position: fixed; z-index: 4; left: 50%; top: calc(var(--sat) + 104px); transform: translate(-50%, -6px);
    max-width: min(90vw, 380px); padding: 9px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--accent);
    color: var(--text); font-size: 13.5px; font-weight: 600; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #menu { position: fixed; z-index: 2; top: calc(var(--sat) + 12px); left: calc(var(--sal) + 12px);
    width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); display: grid; place-items: center; }
  #menu svg { width: 22px; height: 22px; }
  .actions.grid2 { grid-template-columns: 1fr 1fr; max-height: 60vh; overflow: auto; }
  .actions.grid2 .btn:last-child { grid-column: 1 / -1; }

  /* Gợi ý điều khiển */
  #hint { top: calc(var(--sat) + 104px); left: 50%; transform: translateX(-50%);
    max-width: min(92vw, 420px); padding: 10px 14px; border-radius: var(--r);
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    font-size: 13px; text-align: center; transition: opacity .4s ease, transform .4s ease; pointer-events: none; }
  #hint b { color: var(--text); }
  #hint.gone { opacity: 0; transform: translate(-50%, -6px); }

  /* Joystick */
  #joy-ghost { position: fixed; z-index: 1; left: calc(var(--sal) + 40px); bottom: calc(var(--sab) + 40px);
    width: 112px; height: 112px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.22); pointer-events: none; }
  body.joy-on #joy-ghost { opacity: 0; }
  #joy { position: fixed; z-index: 3; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    background: rgba(29,16,32,.55); border: 2px solid rgba(255,255,255,.28); opacity: 0; pointer-events: none; transition: opacity .12s; }
  #joy.active { opacity: 1; }
  #joy-knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%;
    background: var(--text); box-shadow: 0 4px 12px rgba(0,0,0,.4); transform: translate(-50%,-50%); }

  /* Nút hành động */
  #action { position: fixed; z-index: 2; right: calc(var(--sar) + 20px); bottom: calc(var(--sab) + 110px);
    display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 22px;
    border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink);
    font: 800 17px/1 inherit; font-family: inherit; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  #action[hidden] { display: none; }
  #action svg { width: 20px; height: 20px; }
  #action:active { transform: scale(.97); }

  /* Hộp thoại */
  #modal { position: fixed; inset: 0; z-index: 5; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(8,3,10,.55); padding: 16px calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px); }
  #modal[hidden] { display: none; }
  .sheet { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 20px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: rise .22s ease-out; }
  @media (min-width: 700px) { #modal { align-items: center; } }
  .sheet h2 { margin: 0 0 6px; font-size: 20px; }
  .sheet p { margin: 0 0 18px; color: var(--muted); }
  .actions { display: grid; gap: 10px; }
  .btn { min-height: 50px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font: 700 16px/1 inherit; font-family: inherit; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:focus-visible, #action:focus-visible, #phone:focus-visible, #jump:focus-visible, #menu:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }

  #fade { position: fixed; inset: 0; z-index: 6; background: #000; opacity: 0; pointer-events: none; transition: opacity .4s ease; }
  #fade.on { opacity: 1; }

  #loading { position: fixed; inset: 0; z-index: 7; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--muted); font-weight: 600; }
  body.ready #loading { display: none; }
  #error { position: fixed; left: 12px; right: 12px; bottom: calc(var(--sab) + 12px); z-index: 8; padding: 12px 14px;
    background: #3a0d1c; border: 1px solid #7a2340; border-radius: 12px; color: #ffd7e2; font-size: 13px; }

  /* ---- Điện thoại (lấy từ bản 2D) ---- */
  :root { --f-bric: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .phone-ov[hidden] { display: none !important; }
  .phone-ov { z-index: 6; }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  .phone button { font-family: inherit; color: inherit; cursor: pointer; }
  .ph-row.tx { grid-template-columns: 1fr auto; }
  .ph-row .px { font-variant-numeric: tabular-nums; }
  .ph-row .px.pos { color: #8fe6b2; } .ph-row .px.neg { color: #ffb0aa; }
  .ph-big { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; color: #fff; }
  .ph-card .btn { border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #eef1f6; font-weight: 700; }
  .ph-map { width: 100%; height: auto; border-radius: 12px; display: block; }
  .ph-map .mroad { fill: #3a3f4c; } .ph-map .mb { fill: #6b7385; stroke: #8a93a6; stroke-width: .6; }
  .ph-map .mp { cursor: pointer; } .ph-map .hit { fill: transparent; }
  .ph-places { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ph-places .btn { display: flex; align-items: center; gap: 8px; justify-content: flex-start; padding: 0 12px; }
  .ph-places i { width: 12px; height: 12px; border-radius: 50%; flex: none; } .ph-map .mp circle { stroke: #fff; stroke-width: 1.2; }
  .ph-map .mp.on circle { stroke: #ffd36b; stroke-width: 2.4; }
  .ph-map .mp text { font: 700 6.5px system-ui, sans-serif; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: #0c0e13; stroke-width: 2px; }
  .ph-map .me { fill: #ffd36b; stroke: #2a1a00; stroke-width: .8; }
  .phone-ov{position:fixed; inset:0; z-index:85; background:rgba(0,0,0,.62); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  padding:calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
  .phone{width:min(370px, 100%); height:min(720px, calc(100vh - 90px)); height:min(720px, calc(100dvh - 90px)); border-radius:38px; background:#0c0e13; border:7px solid #2a2e37;
  box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 0 0 1px #444a56; display:flex; flex-direction:column; overflow:hidden; color:#eef1f6; animation:pop .25s ease-out}
  .ph-status{display:flex; justify-content:space-between; align-items:center; padding:10px 22px 6px; font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums}
  .ph-status .isl{width:84px; height:22px; border-radius:999px; background:#000}
  .ph-status svg{width:22px; height:12px}
  .ph-screen{flex:1; overflow-y:auto; padding:6px 16px 16px; background:radial-gradient(120% 60% at 50% 0%, #2b3866, #0c0e13 70%)}
  .ph-homebar{height:26px; display:grid; place-items:center; background:#0c0e13; border:0; padding:0}
  .ph-homebar::after{content:""; width:120px; height:5px; border-radius:999px; background:#cfd4de}
  .ph-close{min-height:42px; padding:0 22px; border-radius:999px; border:1px solid rgba(255,255,255,.3); background:rgba(0,0,0,.4); color:#fff; font-weight:700}
  .ph-clock{text-align:center; padding:26px 0 22px}
  .ph-clock b{display:block; font-family:var(--f-bric); font-weight:700; font-size:64px; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .ph-clock span{color:#aeb6c8; font-weight:600}
  .apps{display:grid; grid-template-columns:repeat(3,1fr); gap:18px 10px}
  .papp{display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:0; color:#eef1f6; font-size:12px; font-weight:600}
  .papp i{width:62px; height:62px; border-radius:18px; display:grid; place-items:center; box-shadow:0 6px 14px rgba(0,0,0,.4)}
  .papp i svg{width:32px; height:32px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .ph-head{position:sticky; top:-6px; z-index:2; display:flex; align-items:center; gap:8px; padding:8px 0 10px; background:linear-gradient(#1c2443 70%, transparent)}
  .ph-head button{min-height:34px; padding:0 10px; border-radius:10px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); font-size:13px; font-weight:700}
  .ph-head h4{margin:0; flex:1; font-family:var(--f-bric); font-weight:800; font-size:19px}
  .ph-pill{font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:999px; background:rgba(111,220,156,.2); color:#8fe6b2}
  .ph-pill.closed{background:rgba(255,159,154,.2); color:#ffb0aa}
  .ph-list{display:flex; flex-direction:column; gap:8px}
  .ph-row{display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:center; padding:10px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); text-align:left; color:#eef1f6; width:100%}
  .ph-card{display:flex; flex-direction:column; gap:8px; padding:12px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08)}
  .ph-card h5{margin:0; font-size:15px}
  .ph-card p{margin:0; font-size:12px; color:#aeb6c8; line-height:1.45}
  .ph-card .btn{min-height:42px; font-size:13px}
  .ph-card .btn.go{background:#ff8a3d; border-color:#ff8a3d; color:#2a1200}
  .ph-row h5{margin:0; font-size:14px}
  .ph-row p{margin:2px 0 0; font-size:12px; color:#aeb6c8}
  .ph-note{margin:4px 0 10px; font-size:12.5px; color:#aeb6c8}
  .ph-sub{margin:6px 0 0; font-size:13px; color:#aeb6c8; text-transform:uppercase; letter-spacing:.08em}
  .ph-card .btn small{font-weight:600; opacity:.85}
  .papp i{position:relative}
  .ph-card.v6own p{margin:4px 0}
  .papp i svg.gi{fill:#fff; stroke:none; width:30px; height:30px}
  /* ---- Menu chính và rèm tải (lấy từ bản 2D) ---- */
  :root { --f-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --f-bungee: "Bungee", "Arial Black", Impact, sans-serif; }
#sdm{position:fixed;inset:0;z-index:2147483000;display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(120% 70% at 50% 0%,#5c183a 0%,#2a0f1f 48%,#12070e 100%);color:#f5efe4;font-family:var(--f-body);
  padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
#sdm[hidden]{display:none!important}
html.sdm-on,html.sdm-on body{overflow:hidden}
.sdm-col{width:min(360px,100%);margin:auto;display:flex;flex-direction:column;gap:24px}
.sdm-sign{text-align:center}
.sdm-kick{display:block;font:600 11px/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:#bfaea6}
.sdm-title{margin:12px 0 6px;font:400 clamp(44px,14vw,60px)/1 var(--f-bungee);color:#ffe3a1;letter-spacing:.02em;
  text-shadow:0 0 6px #ecc15e,0 0 18px rgba(236,193,94,.7),0 0 44px rgba(255,110,80,.45);animation:sdmFlick 7s infinite}
.sdm-suits{font-size:15px;letter-spacing:.6em;color:rgba(236,193,94,.55);padding-left:.6em}
@keyframes sdmFlick{0%,90%,100%{opacity:1}91%{opacity:.5}92%{opacity:1}95%{opacity:.72}96%{opacity:1}}
@media (prefers-reduced-motion:reduce){.sdm-title{animation:none}}
.sdm-list,.sdm-rows{display:flex;flex-direction:column;gap:10px}
.sdm-rows{gap:6px}
.sdm-btn,.sdm-row{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;width:100%;cursor:pointer;color:#f5efe4;
  background:rgba(255,255,255,.06);border:1px solid rgba(232,189,92,.35);border-radius:14px;padding:14px 18px;
  transition:transform .12s ease,background-color .12s ease;-webkit-tap-highlight-color:transparent}
.sdm-row{padding:10px 14px;border-radius:12px;border-color:rgba(255,255,255,.12)}
.sdm-btn b{font:700 17px/1.2 var(--f-body)}
.sdm-row b{font:600 14.5px/1.25 var(--f-body)}
.sdm-btn small,.sdm-row small{font:400 12.5px/1.35 var(--f-body);color:#bfaea6}
.sdm-btn:hover,.sdm-row:hover{background:rgba(255,255,255,.1)}
.sdm-btn:active,.sdm-row:active{transform:scale(.98)}
.sdm-btn:focus-visible,.sdm-row:focus-visible,.sdm-back:focus-visible{outline:2px solid #ecc15e;outline-offset:2px}
.sdm-btn.gold{background:linear-gradient(180deg,#f6d77c,#e2ae46);border-color:#f6d77c;color:#2a1d05;box-shadow:0 8px 26px rgba(236,193,94,.22)}
.sdm-btn.gold small{color:#5a4210}
.sdm-btn.gold:hover{background:linear-gradient(180deg,#f9df90,#e8b852)}
.sdm-btn.dim{border-color:rgba(255,255,255,.14)}
.sdm-panel{background:rgba(18,7,14,.62);border:1px solid rgba(232,189,92,.3);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.sdm-panel h2{margin:0 0 2px;font:400 22px/1.15 var(--f-bungee);color:#ffe3a1}
.sdm-panel h3{margin:10px 0 0;font:600 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:#bfaea6}
.sdm-panel p{margin:0;font-size:14px;line-height:1.5;color:#e9dfd6}
.sdm-panel p b{color:#ffe3a1}
.sdm-empty{color:#bfaea6!important;font-size:13px!important}
.sdm-code{box-sizing:border-box;width:100%;min-height:72px;resize:vertical;border-radius:12px;border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.35);color:#f5efe4;padding:10px 12px;font:13px/1.4 ui-monospace,Consolas,monospace}
.sdm-code:focus{outline:2px solid #ecc15e;outline-offset:1px}
.sdm-msg{color:#ff9f9a!important;font-size:13px!important;margin:0;text-align:center}
.sdm-msg.ok{color:#f4d272!important}
.sdm-msg:empty{display:none}
.sdm-back{all:unset;cursor:pointer;align-self:flex-start;padding:8px 2px;color:#ecc15e;font:600 14px/1 var(--f-body)}
.sdm-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sdm-two .sdm-btn{align-items:center;text-align:center}
.sdm-foot{margin:0;text-align:center;font-size:11.5px;color:rgba(191,174,166,.7)}

/* ---- loading curtain ---- */
#sdl{position:fixed;inset:0;z-index:2147483100;display:flex;color:#f5efe4;font-family:var(--f-body);
  background:radial-gradient(120% 70% at 50% 0%,#5c183a 0%,#2a0f1f 48%,#12070e 100%);
  padding:calc(28px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateY(0);transition:transform .8s cubic-bezier(.76,0,.24,1);will-change:transform}
#sdl[hidden]{display:none!important}
#sdl.up{transform:translateY(-100%)}
#sdl.up .sdl-col{opacity:0;transform:translateY(-24px);transition:opacity .35s ease,transform .5s ease}
.sdl-col{width:min(340px,100%);margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.sdl-title{margin:0;font:400 clamp(40px,12vw,54px)/1 var(--f-bungee);color:#ffe3a1;letter-spacing:.02em;
  text-shadow:0 0 6px #ecc15e,0 0 18px rgba(236,193,94,.7),0 0 44px rgba(255,110,80,.45)}
.sdl-suits{font-size:14px;letter-spacing:.6em;padding-left:.6em;color:rgba(236,193,94,.55)}
.sdl-suits{animation:sdlPulse 1.4s ease-in-out infinite}
@keyframes sdlPulse{0%,100%{opacity:.45}50%{opacity:1}}
.sdl-step{margin:18px 0 0;font:600 15px/1.3 var(--f-body);color:#f5efe4;min-height:1.3em}
.sdl-bar{width:100%;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(232,189,92,.25)}
.sdl-bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#e2ae46,#f6d77c);box-shadow:0 0 12px rgba(236,193,94,.6)}
.sdl-tip{margin:6px 0 0;font:400 13px/1.5 var(--f-body);color:#bfaea6;max-width:32ch}
/* neon lip on the bottom edge of the curtain while it lifts */
.sdl-edge{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,#f6d77c 20%,#ff8a6b 50%,#f6d77c 80%,transparent);
  box-shadow:0 0 14px rgba(246,215,124,.9),0 0 34px rgba(255,138,107,.55)}
/* map rises into place under the curtain */
@media (prefers-reduced-motion:reduce){
  #sdl{transition:opacity .4s ease} #sdl.up{transform:none;opacity:0}
}
  #loading { flex-direction: column; gap: 14px; background: radial-gradient(120% 70% at 50% 0%,#5c183a 0%,#2a0f1f 48%,#12070e 100%); }
  #loading .sdl-title { font-size: clamp(40px,12vw,54px); }
  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; } #fade, #hint, #joy { transition: none; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Thành phố Sòng Đêm 3D"></canvas>

<div id="clock" class="hud" role="status" aria-live="off">
  <span id="clock-icon"></span>
  <span id="clock-time">21:00</span>
  <span id="clock-day">Ngày 1</span>
</div>
<button id="menu" type="button" aria-label="Mở menu" title="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
<button id="phone" type="button" aria-label="Mở điện thoại" title="Điện thoại"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<div id="cash" class="hud" aria-label="Tiền trong ví">$1.000</div>
<button id="jump" type="button" aria-label="Nhảy" title="Nhảy (Space)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6.5 11.5 12 6l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<div id="toast" role="status" aria-live="polite"></div>
<div id="hint" class="hud"><b>Kéo bên trái</b> để đi, đẩy hết cỡ để chạy · <b>Kéo bên phải</b> để xoay · Nút <b>↑</b> để nhảy. Mở điện thoại ở góc phải để xem ví, ngân hàng và bản đồ.</div>

<div id="joy-ghost" aria-hidden="true"></div>
<div id="joy" aria-hidden="true"><div id="joy-knob"></div></div>

<button id="action" type="button" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l4-4-4-4M14 12H4"/></svg>
  <span id="action-label">Vào</span>
</button>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet">
    <h2 id="modal-title"></h2>
    <p id="modal-body"></p>
    <div id="modal-actions" class="actions"></div>
  </div>
</div>
<div id="fade"></div>
<div id="loading" role="status"><h1 class="sdl-title">SÒNG ĐÊM</h1><div class="sdl-suits" aria-hidden="true">♠&#xFE0E;♥&#xFE0E;♦&#xFE0E;♣&#xFE0E;</div></div>

<script>
  window.addEventListener('error', function (e) {
    var d = document.getElementById('error') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'error' }));
    d.textContent = 'Lỗi: ' + (e.message || 'không rõ') + '. Hãy thử mở lại bằng Safari hoặc Chrome mới nhất.';
  });
  // Ẩn vòng gợi ý joystick khi đang kéo
  document.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse' && e.clientX < innerWidth / 2) document.body.classList.add('joy-on'); });
  document.addEventListener('pointerup', function () { document.body.classList.remove('joy-on'); });
</script>

<script type="module" src="./main.js"></script>
